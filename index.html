<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>수학 학습 플랜</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#F6F4EF;--surf:#fff;--s2:#EDEAE1;
  --bd:rgba(0,0,0,.07);--bd2:rgba(0,0,0,.12);
  --t:#18160F;--t2:#6A6757;--t3:#A09D93;
  --acc:#3D35E8;--al:#ECEAFD;
  --green:#1A7A47;--gl:#E4F4EB;
  --amber:#AF5E00;--aml:#FDF1E0;
  --rose:#BE3A77;--rl:#FDEDF4;
  --r:12px;--rs:8px;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--t);height:100vh;overflow:hidden;}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.layout{display:flex;flex:1;overflow:hidden;}
.sidebar{width:200px;flex-shrink:0;background:var(--surf);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow-y:auto;}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;}

/* ── SIDEBAR ── */
.sb-logo{padding:16px;border-bottom:1px solid var(--bd);}
.sb-icon{font-size:22px;margin-bottom:6px;}
.sb-title{font-size:14px;font-weight:700;}
.sb-sub{font-size:10px;color:var(--t3);margin-top:2px;}
.sb-sec{padding:8px 8px 4px;}
.sb-lbl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;padding:0 6px;margin-bottom:4px;}
.nb{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border:none;background:none;border-radius:var(--rs);cursor:pointer;font-family:inherit;font-size:12px;color:var(--t2);text-align:left;transition:background .13s;}
.nb:hover{background:var(--s2);}
.nb.active{background:var(--al);color:var(--acc);font-weight:700;}
.nb.active-green{background:var(--gl);color:var(--green);font-weight:700;}
.nav-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.sb-bottom{margin-top:auto;padding:8px;}
.manage-btn{width:100%;padding:7px;border:.5px solid var(--bd2);border-radius:var(--rs);background:none;color:var(--t3);font-size:11px;cursor:pointer;font-family:inherit;}

/* ── MAIN CONTENT ── */
.page{flex:1;overflow-y:auto;padding:24px;}

/* ── METRICS ── */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
.mc{background:var(--surf);border-radius:var(--rs);border:1px solid var(--bd);padding:14px 16px;position:relative;overflow:hidden;}
.mc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.mc.c1::before{background:var(--acc);}
.mc.c2::before{background:var(--green);}
.mc.c3::before{background:var(--amber);}
.mc.c4::before{background:var(--rose);}
.mc-l{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
.mc-v{font-size:24px;font-weight:700;font-family:'DM Mono',monospace;line-height:1;margin-bottom:3px;}
.c1 .mc-v{color:var(--acc);}
.c2 .mc-v{color:var(--green);}
.c3 .mc-v{color:var(--amber);}
.c4 .mc-v{color:var(--rose);}
.mc-s{font-size:11px;color:var(--t3);}
.pbar{height:3px;background:var(--s2);border-radius:10px;margin-top:8px;overflow:hidden;}
.pfill{height:100%;border-radius:10px;background:var(--acc);}

/* ── GRID ── */
.grid2{display:grid;grid-template-columns:1fr 260px;gap:14px;}
.card{background:var(--surf);border-radius:var(--r);border:1px solid var(--bd);overflow:hidden;}
.card-hd{padding:14px 18px 10px;border-bottom:1px solid var(--bd);}
.card-title{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;}
.day-row{padding:11px 18px;border-bottom:.5px solid var(--bd);display:flex;gap:10px;}
.day-row:last-child{border-bottom:none;}
.day-row.today-row{background:#FAFAF7;}
.day-meta{min-width:26px;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:2px;}
.day-nm{font-size:10px;font-weight:700;font-family:'DM Mono',monospace;color:var(--t3);}
.day-nm.tl{color:var(--acc);}
.today-dot{width:4px;height:4px;border-radius:50%;background:var(--acc);}
.tasks{flex:1;display:flex;flex-direction:column;gap:5px;}
.task{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:6px;cursor:pointer;border:.5px solid transparent;transition:all .13s;}
.task:hover{background:var(--bg);border-color:var(--bd);}
.task.done{opacity:.5;}
.tchk{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--bd2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.task.done .tchk{background:var(--acc);border-color:var(--acc);}
.ci{display:none;color:#fff;font-size:10px;font-weight:700;}
.task.done .ci{display:block;}
.ttxt{font-size:12px;color:var(--t);flex:1;}
.task.done .ttxt{text-decoration:line-through;color:var(--t3);}
.badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:100px;white-space:nowrap;}
.b연산{background:#E7EFFC;color:#1A55B0;}
.b도형{background:var(--gl);color:var(--green);}
.b측정{background:var(--aml);color:var(--amber);}
.b수와규칙{background:var(--al);color:var(--acc);}
.b분수{background:var(--rl);color:var(--rose);}
.b시간{background:#E2F5F2;color:#0A7A68;}

/* ── SIDE CARDS ── */
.sc{background:var(--surf);border-radius:var(--r);border:1px solid var(--bd);padding:16px;margin-bottom:10px;}
.sc:last-child{margin-bottom:0;}
.sc-lbl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.streak-big{font-size:38px;font-weight:700;font-family:'DM Mono',monospace;color:var(--acc);line-height:1;}
.streak-sub{font-size:11px;color:var(--t3);margin:3px 0 10px;}
.sdots{display:flex;gap:3px;}
.sdot{width:26px;height:26px;border-radius:7px;border:.5px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;font-family:'DM Mono',monospace;color:var(--t3);}
.sdot.filled{background:var(--acc);border-color:var(--acc);color:#fff;}
.sdot.tod{border-color:var(--acc);color:var(--acc);font-weight:700;}
.ti{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.ti:last-child{margin-bottom:0;}
.tnm{min-width:48px;color:var(--t2);font-size:11px;font-weight:500;}
.ttrack{flex:1;height:4px;background:var(--s2);border-radius:10px;overflow:hidden;}
.tfill{height:100%;border-radius:10px;}
.tpct{font-size:10px;font-family:'DM Mono',monospace;color:var(--t3);min-width:26px;text-align:right;}

/* ── OVERVIEW FAMILY ── */
.fam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
.fam-card{background:var(--surf);border-radius:var(--r);border:1px solid var(--bd);padding:16px;text-align:center;cursor:pointer;transition:all .14s;}
.fam-card:hover{border-color:var(--acc);transform:translateY(-1px);}
.fam-av{width:42px;height:42px;border-radius:50%;margin:0 auto 9px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;}
.fam-name{font-size:13px;font-weight:700;margin-bottom:2px;}
.fam-grade{font-size:10px;color:var(--t3);margin-bottom:9px;}
.fam-pct{font-size:20px;font-weight:700;font-family:'DM Mono',monospace;}
.fam-pb{height:3px;background:var(--s2);border-radius:10px;margin-top:7px;overflow:hidden;}
.fam-pf{height:100%;border-radius:10px;}

/* ── 계획서 페이지 ── */
.plan-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.plan-ytabs{display:flex;gap:5px;margin-bottom:10px;}
.plan-ytab{padding:5px 14px;font-size:12px;font-weight:500;border-radius:100px;border:.5px solid var(--bd2);background:var(--s2);color:var(--t2);cursor:pointer;transition:all .13s;}
.plan-ytab.active{background:var(--t);color:#fff;border-color:var(--t);}
.plan-mnav{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;}
.plan-mtab{padding:3px 11px;font-size:11px;font-weight:500;border-radius:100px;border:.5px solid var(--bd2);background:var(--surf);color:var(--t2);cursor:pointer;transition:all .13s;}
.plan-mtab.active{background:var(--acc);color:#fff;border-color:var(--acc);}
.plan-mo{background:var(--surf);border-radius:var(--r);border:1px solid var(--bd);padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.plan-mo-title{font-size:14px;font-weight:700;min-width:70px;}
.plan-mo-tags{display:flex;gap:6px;flex-wrap:wrap;flex:1;}
.plan-tag{font-size:10px;padding:3px 8px;border-radius:100px;font-weight:500;}
.plan-tag.adv{background:var(--al);color:#3C3489;}
.plan-tag.sch{background:var(--gl);color:var(--green);}
.plan-pb-wrap{display:flex;align-items:center;gap:6px;}
.plan-pb{width:80px;height:3px;background:var(--s2);border-radius:10px;overflow:hidden;}
.plan-pbf{height:100%;border-radius:10px;}
.plan-pct{font-size:10px;font-family:'DM Mono',monospace;color:var(--t3);}
.plan-week{background:var(--surf);border-radius:var(--r);border:1px solid var(--bd);overflow:hidden;margin-bottom:7px;}
.plan-whd{padding:8px 14px;background:var(--s2);display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.plan-whd:hover{background:#E5E2D9;}
.plan-wt{font-size:11px;font-weight:700;}
.plan-wm{font-size:10px;color:var(--t3);font-family:'DM Mono',monospace;}
.plan-wa{transition:transform .18s;}
.plan-wa.open{transform:rotate(180deg);}
.plan-tbl{width:100%;border-collapse:collapse;}
.plan-tbl th{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;padding:6px 12px;text-align:left;border-bottom:1px solid var(--bd);background:#FAFAF7;}
.plan-tbl td{padding:8px 12px;border-bottom:.5px solid var(--bd);font-size:11px;vertical-align:middle;}
.plan-tbl tr:last-child td{border-bottom:none;}
.plan-tbl tr.today-plan-row{background:#FFFDE7;}
.plan-tbl tr:hover td{background:#FAFAF7;}
.plan-dn{font-weight:700;font-family:'DM Mono',monospace;font-size:10px;color:var(--t3);}
.plan-dn.td{color:var(--acc);}
.plan-dk{font-size:9px;color:var(--t3);}
.plan-dk.td{color:var(--acc);font-weight:700;}
.type-pill{font-size:9px;font-weight:700;padding:2px 6px;border-radius:100px;}
.type-pill.advance{background:var(--al);color:#3C3489;}
.type-pill.school{background:var(--gl);color:var(--green);}
.plan-dc{font-size:11px;color:var(--t);line-height:1.5;}
.plan-db{font-size:9px;color:var(--t3);font-family:'DM Mono',monospace;margin-top:1px;}
.plan-dm{font-size:9px;font-family:'DM Mono',monospace;color:var(--t3);background:var(--s2);padding:2px 5px;border-radius:100px;}
.pcb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--bd2);cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 auto;transition:all .14s;}
.pcb.adv-done{background:var(--acc);border-color:var(--acc);}
.pcb.adv-done::after,.pcb.sch-done::after{content:'✓';color:#fff;font-size:9px;font-weight:700;}
.pcb.sch-done{background:var(--green);border-color:var(--green);}
.today-badge{display:inline-block;background:var(--acc);color:#fff;font-size:8px;font-weight:700;padding:1px 5px;border-radius:100px;margin-left:3px;vertical-align:middle;}

/* ── 계통도 ── */
.map-wrap{overflow:auto;border-radius:var(--r);border:1px solid var(--bd);background:#fff;position:relative;}
.map-leg{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
.map-leg-i{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--t2);padding:3px 8px;border-radius:100px;border:.5px solid var(--bd2);background:var(--surf);cursor:pointer;}
.map-leg-d{width:8px;height:8px;border-radius:3px;}
.map-vbtns{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;}
.map-vbtn{font-size:11px;padding:4px 12px;border-radius:100px;border:.5px solid var(--bd2);background:var(--s2);cursor:pointer;color:var(--t2);font-family:inherit;transition:all .13s;}
.map-vbtn.active{background:var(--t);color:#fff;border-color:var(--t);}
.map-detail{margin-top:12px;background:var(--surf);border-radius:var(--r);border:1px solid var(--bd);padding:12px 16px;font-size:12px;color:var(--t2);line-height:1.6;min-height:50px;}
.map-tt{position:absolute;background:var(--surf);border:1px solid var(--bd2);border-radius:9px;padding:8px 11px;font-size:11px;pointer-events:none;opacity:0;transition:opacity .1s;max-width:200px;z-index:99;box-shadow:0 2px 8px rgba(0,0,0,.09);line-height:1.5;}
.map-tt.show{opacity:1;}
.d-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.dtag{font-size:10px;padding:2px 7px;border-radius:100px;font-weight:500;}

/* ── 자녀 관리 모달 ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-bg.open{display:flex;}
.modal{background:var(--surf);border-radius:16px;padding:24px;max-width:360px;width:100%;}
.modal h3{font-size:15px;font-weight:700;margin-bottom:14px;}
.finput{width:100%;padding:9px 12px;border:1px solid var(--bd2);border-radius:var(--rs);font-size:13px;font-family:inherit;outline:none;transition:border .13s;}
.finput:focus{border-color:var(--acc);}
.btn-primary{width:100%;padding:11px;background:var(--acc);color:#fff;border:none;border-radius:var(--rs);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:8px;}
.child-row{display:flex;gap:6px;margin-bottom:8px;}
.del-btn{background:none;border:none;color:var(--t3);cursor:pointer;font-size:16px;padding:0 4px;}
.add-child-btn{width:100%;padding:8px;border:1px dashed var(--acc);border-radius:var(--rs);background:none;color:var(--acc);font-size:12px;cursor:pointer;font-family:inherit;margin-top:4px;}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--t);color:#fff;padding:8px 18px;border-radius:100px;font-size:13px;font-weight:500;z-index:999;transition:transform .22s;pointer-events:none;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}

/* ── 포인트 뱃지 ── */
.pts-badge{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#F9A825,#F57F17);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;font-family:'DM Mono',monospace;}
.pts-card{background:linear-gradient(135deg,#FFF8E1,#FFF3CD);border:1px solid #F9A825;border-radius:var(--r);padding:14px 16px;margin-bottom:10px;}
.pts-card .sc-lbl{color:#AF6C00;}
.pts-big{font-size:32px;font-weight:700;font-family:'DM Mono',monospace;color:#F57F17;line-height:1;}
.pts-sub{font-size:11px;color:#AF6C00;margin:3px 0 10px;}
.pts-bar-wrap{height:6px;background:#FFE082;border-radius:10px;overflow:hidden;}
.pts-bar-fill{height:100%;background:linear-gradient(90deg,#F9A825,#F57F17);border-radius:10px;transition:width .4s;}

/* ── 리워드 팝업 ── */
.reward-popup{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:300;animation:fadeIn .2s;}
.reward-popup.show{display:flex;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.reward-box{background:#fff;border-radius:24px;padding:40px 36px;max-width:360px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:popUp .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes popUp{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.reward-trophy{font-size:72px;margin-bottom:16px;display:block;animation:bounce 1s infinite alternate;}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.reward-title{font-size:22px;font-weight:700;color:#F57F17;margin-bottom:8px;}
.reward-msg{font-size:15px;color:var(--t2);margin-bottom:6px;line-height:1.6;}
.reward-pts{font-size:14px;font-weight:700;color:#F57F17;font-family:'DM Mono',monospace;margin-bottom:24px;}
.reward-close{background:linear-gradient(135deg,#F9A825,#F57F17);color:#fff;border:none;border-radius:100px;padding:11px 32px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;}

/* ── 오늘 학습 현황 태그 ── */
.day-pts-tag{font-size:10px;font-weight:700;padding:1px 7px;border-radius:100px;margin-left:6px;}
.day-pts-full{background:#E8F5E9;color:#1A7A47;}
.day-pts-half{background:#FFF8E1;color:#AF6C00;}
.day-pts-none{background:#FFEBEE;color:#C62828;}

/* ── plan 태스크 행 ── */
.plan-task-row{display:flex;align-items:flex-start;gap:10px;padding:8px 18px;border-bottom:.5px solid var(--bd);}
.plan-task-row:last-child{border-bottom:none;}
.plan-task-row.today-row{background:#FFFDE7;}
.plan-day-meta{min-width:40px;display:flex;flex-direction:column;gap:2px;padding-top:2px;}
.plan-day-label{font-size:10px;font-weight:700;color:var(--t3);font-family:'DM Mono',monospace;}
.plan-day-label.tl{color:var(--acc);}
.plan-day-date{font-size:9px;color:var(--t3);}
.plan-tasks-col{flex:1;display:flex;flex-direction:column;gap:5px;}
.plan-task-item{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:6px;cursor:pointer;border:.5px solid transparent;transition:all .13s;}
.plan-task-item:hover{background:var(--bg);border-color:var(--bd);}
.plan-task-item.done .ttxt{text-decoration:line-through;color:var(--t3);}
.plan-task-item.done .tchk{background:var(--acc);border-color:var(--acc);}
.plan-task-item.done .ci{display:block;}
.type-tag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:100px;}
.type-tag.advance{background:var(--al);color:#3C3489;}
.type-tag.school{background:var(--gl);color:var(--green);}

/* ── 반응형 ── */
@media(max-width:860px){.sidebar{width:54px;} .sb-title,.sb-sub,.sb-lbl,.nb span:not(.nav-av){display:none;} .metrics{grid-template-columns:1fr 1fr;} .grid2{grid-template-columns:1fr;}}
@media(max-width:520px){.sidebar{display:none;}}
</style>
</head>
<body>
<!-- 패밀리코드 입력 스플래시 -->
<div id="splash" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:500;align-items:center;justify-content:center;flex-direction:column;gap:0;">
  <div style="background:var(--surf);border-radius:20px;padding:36px 32px;max-width:380px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,.12);text-align:center;">
    <div style="font-size:36px;margin-bottom:12px;">📐</div>
    <div style="font-size:20px;font-weight:700;margin-bottom:6px;">수학 학습 플랜</div>
    <div style="font-size:13px;color:var(--t3);margin-bottom:24px;">패밀리 코드로 가족과 함께 사용하세요</div>
    <input id="codeInput" type="text" placeholder="패밀리 코드 입력 (예: HONG2024)"
      style="width:100%;padding:12px 14px;border:1.5px solid var(--bd2);border-radius:10px;font-size:14px;font-family:inherit;text-align:center;text-transform:uppercase;letter-spacing:.08em;outline:none;margin-bottom:10px;"
      maxlength="12"
      onkeydown="if(event.key==='Enter') enterWithCode(this.value)">
    <button onclick="enterWithCode(document.getElementById('codeInput').value)"
      style="width:100%;padding:13px;background:var(--acc);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:16px;">
      입장하기
    </button>

let _db = null;
let _fcode = ''; // 현재 패밀리 코드
let _listeners = []; // 등록된 onValue 리스너 해제 함수 모음

// ── 데이터 경로 ──
function fp(path) { return 'families/' + _fcode + '/' + safeKey(path); }

// ── Firebase 읽기/쓰기 헬퍼 ──
// 비동기가 아니라 캐시 기반으로 동작 (onValue 스냅샷 캐시)
const _cache = {};

function safeKey(k) { return k.replace(/[.#$[\]/]/g,'_'); }
function fbSet(path, val) {
  if (!_db) return;
  _cache[path] = val;
  _db.ref('families/' + _fcode + '/' + safeKey(path)).set(val);
}

function fbGet(path) {
  return _cache[path] !== undefined ? _cache[path] : null;
}

function fbUpdate(path, val) {
  if (!_db) return;
  const cur = _cache[path] || {};
  const next = Object.assign({}, cur, val);
  _cache[path] = next;
  _db.ref('families/' + _fcode + '/' + safeKey(path)).update(val);
}

// ── localStorage 호환 헬퍼 (내부 캐시 사용) ──
function lsGet(key) {
  if (!_db) {
    try { return JSON.parse(localStorage.getItem(key)); } catch(e) { return null; }
  }
  const sk = safeKey(key);
  const v = _cache[sk];
  return v !== undefined ? v : null;
}

function lsSet(key, val) {
  if (!_db) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
    return;
  }
  const sk = safeKey(key);
  _cache[sk] = val;
  _db.ref('families/' + _fcode + '/' + sk).set(val);
}

function getPlanChecks(mk) { return lsGet('pchk_'+mk) || {}; }
function setPlanCheck(mk, idx, v) {
  const c = getPlanChecks(mk);
  c[String(idx)] = v;
  lsSet('pchk_'+mk, c);
}
function getChecks(child, grade, wo) { return lsGet('chk_'+child+'_'+grade+'_'+wo) || {}; }
function setCheck(child, grade, wo, k, v) {
  const c = getChecks(child, grade, wo);
  c[k] = v;
  lsSet('chk_'+child+'_'+grade+'_'+wo, c);
}

// 패밀리코드로 입장
function enterWithCode(code) {
  code = code.trim().toUpperCase();
  if (!code) { alert('패밀리 코드를 입력해주세요'); return; }
  _fcode = code;
  localStorage.setItem('last_fcode', code);

  // 패밀리 데이터 로드
  _db.ref('families/' + code + '/state').once('value').then(snap => {
    const saved = snap.val();
    if (saved && saved.children && saved.children.length) {
      state = saved;
    } else {
      // 새 패밀리
      state = {
        familyCode: code,
        children: [{ name: '선우', grade: 2 }]
      };
      _db.ref('families/' + code + '/state').set(state);
    }
    startListening();
    hideSplash();
    curChild = state.children[0].name;
    curGrade = state.children[0].grade;
    curView = 'child';
    renderSidebar();
    renderPage();
  });
}

// 실시간 리스닝 시작
function startListening() {
  // 기존 리스너 해제
  _listeners.forEach(fn => fn());
  _listeners = [];

  // state(자녀 목록) 변경 감지
  const stateRef = _db.ref('families/' + _fcode + '/state');
  const stateOff = stateRef.on('value', snap => {
    const val = snap.val();
    if (val) {
      state = val;
      renderSidebar();
    }
  });
  _listeners.push(() => stateRef.off('value', stateOff));

  // 데이터 전체 캐시 업데이트 (체크·포인트·편집)
  const dataRef = _db.ref('families/' + _fcode);
  const dataOff = dataRef.on('value', snap => {
    const val = snap.val() || {};
    // 캐시 전체 동기화 (Firebase 키 → 로컬 캐시 키)
    Object.keys(val).forEach(k => {
      if (k !== 'state') {
        _cache[k] = val[k];
      }
    });
    renderPage();
  });
  _listeners.push(() => dataRef.off('value', dataOff));
}

  let saved = null;

function addPoints(child, pts) {
  const prev = getPoints(child);
  const next = Math.max(0, prev + pts);
  lsSet('pts_'+child, next);
  if (pts > 0) {
    const prevM = Math.floor(prev / 1000);
    const nextM = Math.floor(next / 1000);
    if (nextM > prevM && nextM > 0) {
      document.getElementById('rewardPtsLabel').textContent = '누적 ' + next.toLocaleString() + 'P 달성!';
      document.getElementById('rewardPopup').classList.add('show');
    }
  }
  return next;
}

// 일~토 기준 주 데이터 (weekOffset 반영)
function getWeekPlanData() {
  const base = new Date(PLAN_TODAY);
  // 이번 주 일요일 구하기 (일=0, 월=1 ... 토=6)
  const dow = base.getDay(); // 0=일
  const sunday = new Date(base);
  sunday.setDate(base.getDate() - dow + weekOffset * 7);
  const saturday = new Date(sunday);
  saturday.setDate(sunday.getDate() + 6);

  // 주의 첫날(일요일) 기준으로 월 데이터 찾기
  const y = sunday.getFullYear(), m = sunday.getMonth()+1;
  const sundayStr = sunday.toISOString().slice(0,10);

  // 7일치 날짜 문자열 생성
  const weekDates = [];
  for (let i=0; i<7; i++) {
    const d = new Date(sunday);
    d.setDate(sunday.getDate() + i);
    weekDates.push(d.toISOString().slice(0,10));
  }

  // 각 날짜에 해당하는 PLAN_MONTHS 데이터 모으기 (월 경계 고려)
  const dayEntries = [];
  weekDates.forEach(dateStr => {
    const dd = new Date(dateStr);
    const dy = dd.getFullYear(), dm = dd.getMonth()+1;
    const mo = PLAN_MONTHS.find(x=>x.year===dy&&x.month===dm);
    if (!mo) { dayEntries.push(null); return; }
    const entry = mo.days.find(d=>d.date===dateStr);
    if (entry) {
      const gi = mo.days.indexOf(entry);
      dayEntries.push({ day: entry, globalIdx: gi, monthKey: dy+'-'+String(dm).padStart(2,'0') });
    } else {
      dayEntries.push(null);
    }
  });

  return { weekDates, dayEntries,
    sundayStr, saturdayStr: saturday.toISOString().slice(0,10) };
}

// 7. 아이별 대시보드

function renderChild(pg) {
  const childIdx = state.children.findIndex(c=>c.name===curChild);
  const col = AVATAR_COLORS[childIdx>=0 ? childIdx%AVATAR_COLORS.length : 0];
  const points = getPoints(curChild);
  const nextMilestone = (Math.floor(points/1000)+1)*1000;
  const ptsInCycle = points % 1000;

  const wd = getWeekPlanData();
  const DAYS7 = ['일','월','화','수','목','금','토'];
  const todayDow = new Date(PLAN_TODAY).getDay();

  // 완료/전체 집계 (새 구조: dayEntries)
  let total=0, done=0;
  if (wd) {
    wd.dayEntries.forEach(e => {
      if (!e) return;
      total++;
      const c = getPlanChecks(e.monthKey);
      if (c[e.globalIdx]) done++;
    });
  }
  const pct = total>0 ? Math.round(done/total*100) : 0;

  // 연속 학습일 (오늘 포함 과거로 연속 체크된 날 수)
  let streak = 0;
  if (wd) {
    const today = new Date(PLAN_TODAY);
    for (let back=0; back<60; back++) {
      const d = new Date(today); d.setDate(today.getDate()-back);
      const ds = d.toISOString().slice(0,10);
      const dy = d.getFullYear(), dm = d.getMonth()+1;
      const mo = PLAN_MONTHS.find(x=>x.year===dy&&x.month===dm);
      if (!mo) break;
      const entry = mo.days.find(x=>x.date===ds);
      if (!entry) { if(back>0) break; continue; }
      const gi = mo.days.indexOf(entry);
      const mk2 = dy+'-'+String(dm).padStart(2,'0');
      const c = getPlanChecks(mk2);
      if (c[gi]) streak++;
      else if (back>0) break;
    }
  }

  const weekLbl = weekOffset===0?'이번 주':weekOffset===-1?'지난 주':weekOffset===1?'다음 주':weekOffset>0?`+${weekOffset}주`:`${weekOffset}주`;
  const weekRange = wd ? `${wd.sundayStr.slice(5).replace('-','/')} ~ ${wd.saturdayStr.slice(5).replace('-','/')}` : '';

  // 상단
  const topbar = document.createElement('div');
  topbar.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;';
  topbar.innerHTML=`<div style="font-size:17px;font-weight:700;display:flex;align-items:center;gap:9px;">
    <div class="nav-av" style="background:${col}22;color:${col};width:30px;height:30px;font-size:15px;">${curChild[0]}</div>
    ${curChild} · ${curGrade}학년</div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="pts-badge">⭐ ${points.toLocaleString()}P</span>
      <div style="display:flex;align-items:center;gap:4px;background:var(--surf);border:1px solid var(--bd2);border-radius:100px;padding:2px 5px;">
        <button onclick="changeWeek(-1)" style="border:none;background:none;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:15px;color:var(--t2);">‹</button>
        <span style="font-size:11px;font-weight:500;min-width:80px;text-align:center;">${weekLbl}<br><span style="font-size:9px;color:var(--t3);font-weight:400;">${weekRange}</span></span>
        <button onclick="changeWeek(1)" style="border:none;background:none;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:15px;color:var(--t2);">›</button>
      </div>
    </div>`;
  pg.appendChild(topbar);

  // 지표
  const metrics = document.createElement('div');
  metrics.className='metrics';
  metrics.innerHTML=`
    <div class="mc c1"><div class="mc-l">이번 주 달성률</div><div class="mc-v">${pct}%</div><div class="pbar"><div class="pfill" style="width:${pct}%;"></div></div></div>
    <div class="mc c2"><div class="mc-l">완료한 학습</div><div class="mc-v">${done}</div><div class="mc-s">/${total}일</div></div>
    <div class="mc c3"><div class="mc-l">누적 포인트</div><div class="mc-v" style="font-size:18px;">${points.toLocaleString()}</div><div class="mc-s">다음 트로피 ${nextMilestone-points}P</div></div>
    <div class="mc c4"><div class="mc-l">연속 학습일</div><div class="mc-v">${streak}</div><div class="mc-s">일 연속 🔥</div></div>`;
  pg.appendChild(metrics);

  // 포인트 바
  const ptsBar = document.createElement('div');
  ptsBar.className='pts-card sc'; ptsBar.style.marginBottom='16px';

  pg.appendChild(ptsBar);

  // 그리드
  const grid = document.createElement('div');
  grid.className='grid2';

  // ── 주간 학습 계획 카드 ──
  const planCard = document.createElement('div');
  planCard.className='card';

  // 카드 헤더 + 편집 버튼
  const cardHd = document.createElement('div');
  cardHd.className='card-hd';
  cardHd.style.cssText='display:flex;align-items:center;justify-content:space-between;';

  planCard.appendChild(cardHd);

  if (!wd || !wd.dayEntries.every(e=>e===null&&true)) {
    wd.dayEntries.forEach((e, di) => {
      const dateStr = wd.weekDates[di];
      const dayKrLabel = DAYS7[di];
      const isToday = dateStr===PLAN_TODAY;

      const row = document.createElement('div');
      row.className='plan-task-row'+(isToday?' today-row':'');

      if (!e) {
        // 계획 없는 날
        row.innerHTML=`
          <div class="plan-day-meta">
            <div class="plan-day-label${isToday?' tl':''}">${dayKrLabel}</div>
            <div class="plan-day-date">${dateStr.slice(5).replace('-','/')}</div>
          </div>
          <div class="plan-tasks-col" style="padding:4px 0;">
            <div id="plan-view-${di}" style="font-size:11px;color:var(--t3);">계획 없음</div>

                onchange="saveCustomPlan(event)">

      } else {
        const mk = e.monthKey;
        const gi = e.globalIdx;
        const day = e.day;
        const isAdv = day.type==='advance';
        const planChks = getPlanChecks(mk);
        const isDone = !!planChks[gi];
        const ps_c = PLAN_PSUMMARY[mk]||['',''];
        const unitName = isAdv ? ps_c[1] : ps_c[0];
        const unitTag = unitName
          ? `<span style="font-size:10px;color:${isAdv?'#3C3489':'var(--green)'};opacity:.8;">(${unitName})</span>`
          : '';
        // 사용자 커스텀 내용 확인
        const custom = lsGet('custom_'+mk+'_'+gi);
        const displayContent = custom ? custom.content : day.content;
        const displayBook = custom ? (custom.book||day.book) : day.book;
        const displayType = custom ? (custom.type||day.type) : day.type;
        const displayMins = custom ? (custom.minutes||day.minutes) : day.minutes;
        const displayAdv = displayType==='advance';

        row.innerHTML=`
          <div class="plan-day-meta">
            <div class="plan-day-label${isToday?' tl':''}">${dayKrLabel}</div>
            <div class="plan-day-date">${dateStr.slice(5).replace('-','/')}</div>
          </div>
          <div class="plan-tasks-col">
            <div id="plan-view-${di}">
              <div class="plan-task-item${isDone?' done':''}" onclick="toggleDashTask('${mk}',${gi},'${curChild}')">
                <div class="tchk" style="${isDone?'background:var(--acc);border-color:var(--acc);':''}"><span class="ci" style="${isDone?'display:block;':''}">✓</span></div>
                <span class="ttxt" style="${isDone?'text-decoration:line-through;color:var(--t3);':''}">${displayContent}</span>
                <span class="type-tag ${displayAdv?'advance':'school'}">${displayAdv?'선행':'현행'}</span>
              </div>
              <div style="font-size:10px;color:var(--t3);padding-left:28px;margin-top:2px;">${unitTag} 📖 ${displayBook} · ⏱ ${displayMins}분</div>
            </div>
            <div id="plan-edit-${di}" style="display:none;padding:4px 0;display:none;">
              <div style="display:flex;flex-direction:column;gap:5px;">
                <input type="text" id="ec-${di}" value="${displayContent.replace(/"/g,'&quot;')}" placeholder="학습 내용"
                  style="padding:5px 8px;border:1px solid var(--bd2);border-radius:var(--rs);font-size:11px;font-family:inherit;width:100%;">
                <div style="display:flex;gap:5px;">
                  <input type="text" id="eb-${di}" value="${displayBook.replace(/"/g,'&quot;')}" placeholder="교재·쪽수"
                    style="flex:1;padding:5px 8px;border:1px solid var(--bd2);border-radius:var(--rs);font-size:11px;font-family:inherit;">
                  <select id="et-${di}" style="padding:5px 8px;border:1px solid var(--bd2);border-radius:var(--rs);font-size:11px;font-family:inherit;">
                    <option value="advance"${displayAdv?' selected':''}>선행</option>
                    <option value="school"${!displayAdv?' selected':''}>현행</option>
                  </select>
                  <input type="number" id="em-${di}" value="${displayMins}" min="5" max="120"
                    style="width:56px;padding:5px 8px;border:1px solid var(--bd2);border-radius:var(--rs);font-size:11px;font-family:inherit;">
                  <span style="font-size:10px;color:var(--t3);align-self:center;">분</span>
                </div>
                <div style="display:flex;gap:5px;">
                  <button onclick="saveEdit(${di},'${mk}',${gi})" style="flex:1;padding:5px;background:var(--acc);color:#fff;border:none;border-radius:var(--rs);font-size:11px;cursor:pointer;font-family:inherit;">저장</button>
                  <button onclick="resetEdit(${di},'${mk}',${gi})" style="padding:5px 10px;background:var(--s2);color:var(--t2);border:none;border-radius:var(--rs);font-size:11px;cursor:pointer;font-family:inherit;">초기화</button>

  grid.appendChild(planCard);

  // ── 사이드 ──
  const side = document.createElement('div');
  let streakHtml=`<div class="sc"><div class="sc-lbl">연속 학습 현황</div>
    <div class="streak-big">${streak}</div><div class="streak-sub">일 연속 달성</div><div class="sdots">`;
  for(let i=6;i>=0;i--){
    const di2=(todayDow-i+7)%7;
    streakHtml+=`<div class="sdot ${i===0?'tod':''} ${i<streak&&streak>0?'filled':''}">${DAYS7[di2]}</div>`;
  }
  streakHtml+='</div></div>';

  let dayPtsHtml='<div class="sc"><div class="sc-lbl">일별 포인트 현황</div>';
  if(wd){
    wd.dayEntries.forEach((e,di)=>{
      const dateStr=wd.weekDates[di];
      const isToday=dateStr===PLAN_TODAY;
      const isPast=dateStr<PLAN_TODAY;
      let tag='',tagCls='';
      if(e){
        const c=getPlanChecks(e.monthKey);
        if(c[e.globalIdx]){tag='100P ✓';tagCls='day-pts-full';}
        else if(isPast){tag='0P';tagCls='day-pts-none';}
        else if(isToday){tag='진행중';tagCls='day-pts-half';}
        else{tag='예정';tagCls='';}
      } else { tag='없음'; tagCls=''; }
      dayPtsHtml+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:.5px solid var(--bd);">

        ${tag?`<span class="day-pts-tag ${tagCls}">${tag}</span>`:''}
      </div>`;
    });
  }
  dayPtsHtml+='</div>';
  side.innerHTML=streakHtml+dayPtsHtml;
  grid.appendChild(side);
  pg.appendChild(grid);
}

// ── 편집 모드 토글 ──
let _editMode = false;
function toggleEditMode() {
  _editMode = !_editMode;
  const btn = document.getElementById('editPlanBtn');
  if (btn) btn.textContent = _editMode ? '✅ 완료' : '✏ 편집';
  if (btn) btn.style.background = _editMode ? 'var(--al)' : 'var(--s2)';
  if (btn) btn.style.color = _editMode ? 'var(--acc)' : 'var(--t2)';
  for (let di=0; di<7; di++) {
    const view = document.getElementById('plan-view-'+di);
    const edit = document.getElementById('plan-edit-'+di);
    if (view) view.style.display = _editMode ? 'none' : '';
    if (edit) edit.style.display = _editMode ? '' : 'none';
  }
}

function saveEdit(di, mk, gi) {
  const content = document.getElementById('ec-'+di)?.value.trim();
  const book    = document.getElementById('eb-'+di)?.value.trim();
  const type    = document.getElementById('et-'+di)?.value;
  const minutes = parseInt(document.getElementById('em-'+di)?.value)||20;
  if (!content) { showToast('내용을 입력해주세요'); return; }
  lsSet('custom_'+mk+'_'+gi, { content, book, type, minutes });
  showToast('저장됐어요!');
  _editMode = false;
  renderPage();
}

function resetEdit(di, mk, gi) {
  if (_db && _fcode) {
    _db.ref('families/' + _fcode + '/' + safeKey('custom_'+mk+'_'+gi)).remove();
    delete _cache['custom_'+mk+'_'+gi];
  } else {
    localStorage.removeItem('custom_'+mk+'_'+gi);
  }
  showToast('원래 계획으로 복원됐어요');
  _editMode = false;
  renderPage();
}

function toggleDashTask(mk, gi, childName) {
  if(!mk) return;
  const checks = getPlanChecks(mk);
  const wasDone = !!checks[gi];
  setPlanCheck(mk, gi, !wasDone);
  if(!wasDone) {
    addPoints(childName, 100);
    showToast('✓ 완료! +100P 🎉');
  } else {
    addPoints(childName, -100);
    showToast('체크를 취소했어요 -100P');
  }
  renderPage();
}

function toggleTask(day, idx) {
  const checks = getChecks(curChild, curGrade, weekOffset);
  const k = day+'_'+idx;
  const wasDone = !!checks[k];
  setCheck(curChild, curGrade, weekOffset, k, !wasDone);
  if(!wasDone) showToast('✓ 완료! 잘했어요 🎉');
  renderPage();
}

function changeWeek(dir) { weekOffset += dir; renderPage(); }

  const tbl = document.createElement('table');
  tbl.style.cssText = 'width:100%;border-collapse:collapse;';
  tbl.innerHTML = `<thead><tr style="background:#FAFAF7;">
    <th style="padding:8px 12px;font-size:10px;font-weight:700;color:var(--t3);text-align:center;border-bottom:1px solid var(--bd);width:32px;">완료</th>
    <th style="padding:8px 12px;font-size:10px;font-weight:700;color:var(--t3);text-align:left;border-bottom:1px solid var(--bd);width:60px;">날짜</th>
    <th style="padding:8px 12px;font-size:10px;font-weight:700;color:var(--t3);text-align:left;border-bottom:1px solid var(--bd);width:52px;">구분</th>
    <th style="padding:8px 12px;font-size:10px;font-weight:700;color:var(--t3);text-align:left;border-bottom:1px solid var(--bd);">학습 내용</th>
    <th style="padding:8px 12px;font-size:10px;font-weight:700;color:var(--t3);text-align:left;border-bottom:1px solid var(--bd);width:44px;">시간</th>
  </tr></thead>`;
  const tbody = document.createElement('tbody');

  mo.days.forEach((day, gi) => {
    const isToday = day.date===PLAN_TODAY;
    const isDone = !!checks[gi];
    const isAdv = day.type==='advance';
    const custom = lsGet('custom_'+mk+'_'+gi);
    const content = custom ? custom.content : day.content;
    const mins = custom ? (custom.minutes||day.minutes) : day.minutes;
    const type = custom ? (custom.type||day.type) : day.type;
    const isAdvFinal = type==='advance';

    const tr = document.createElement('tr');

          ${isDone?'<span style="color:#fff;font-size:9px;font-weight:700;">✓</span>':''}
        </div>
      </td>
      <td style="padding:7px 12px;">
        <div style="font-size:11px;font-weight:700;font-family:'DM Mono',monospace;color:${isToday?'var(--acc)':'var(--t3)'};">${day.date.slice(5).replace('-','/')}</div>
        <div style="font-size:10px;color:${isToday?'var(--acc)':'var(--t3)'};">${day.dayKr}${isToday?'&nbsp;●':''}</div>
      </td>
      <td style="padding:7px 12px;">
        <span style="font-size:9px;font-weight:700;padding:2px 6px;border-radius:100px;background:${isAdvFinal?'var(--al)':'var(--gl)'};color:${isAdvFinal?'#3C3489':'var(--green)'};">${isAdvFinal?'선행':'현행'}</span>
      </td>
      <td style="padding:7px 12px;">
        <div style="font-size:11px;color:var(--t);${isDone?'text-decoration:line-through;color:var(--t3);':''}">${content}</div>
        <div style="font-size:10px;color:var(--t3);margin-top:1px;">📖 ${day.book}</div>
      </td>
      <td style="padding:7px 12px;font-size:10px;font-family:'DM Mono',monospace;color:var(--t3);">${mins}분</td>`;
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  tblWrap.appendChild(tbl);
  pg.appendChild(tblWrap);

  // 오늘 스크롤
  setTimeout(()=>{
    const rows = pg.querySelectorAll('tr');
    rows.forEach(r=>{ if(r.style.background.includes('FFFDE7')) r.scrollIntoView({behavior:'smooth',block:'center'}); });
  }, 100);
}

function mpToggle(mk, gi) {
  const checks = getPlanChecks(mk);
  const wasDone = !!checks[gi];
  setPlanCheck(mk, gi, !wasDone);
  if(!wasDone) { addPoints(curChild||state.children[0]?.name, 100); showToast('✓ 완료! +100P 🎉'); }
  else { addPoints(curChild||state.children[0]?.name, -100); showToast('체크 취소 -100P'); }
  renderPage();
}

function logout() {

  _listeners.forEach(fn => fn());
  _listeners = [];
  _fcode = '';
  _db = null;
  localStorage.removeItem('last_fcode');

  // Firebase 재초기화

  showSplash();
}

function renderPlan(pg) {
  // ★ 핵심 수정: 매번 초기화
  pg.innerHTML = '';
  pg.style.padding = '20px';

  const topDiv = document.createElement('div');
  topDiv.innerHTML = `<div style="font-size:17px;font-weight:700;margin-bottom:12px;">📅 선우 수학 학습 계획서 2026~2028</div>
    <div style="font-size:11px;color:var(--t3);margin-bottom:12px;">선행 2일(20분) → 현행 1일(25분) 사이클 · 초등 전과정 완성</div>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;">
      <div style="display:flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:100px;border:.5px solid var(--bd2);background:var(--surf);">
        <div style="width:8px;height:8px;border-radius:3px;background:#3D35E8;"></div>선행(최상위S)·20분</div>
      <div style="display:flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:100px;border:.5px solid var(--bd2);background:var(--surf);">
        <div style="width:8px;height:8px;border-radius:3px;background:#1A7A47;"></div>현행(학교)·25분</div>
      <div style="font-size:11px;padding:3px 8px;border-radius:100px;border:.5px solid var(--acc);background:#FFFDE7;">📍 오늘</div>
    </div>`;
  pg.appendChild(topDiv);

  // 연도 탭
  const ytabs = document.createElement('div');
  ytabs.className = 'plan-ytabs';
  PLAN_YEAR_TABS.forEach(yt => {
    const b = document.createElement('button');
    b.className = 'plan-ytab' + (yt.id===planCurYear?' active':'');
    b.textContent = yt.label;
    b.onclick = () => { planCurYear=yt.id; planCurMonth=yt.months[0]; renderPlan(pg); };
    ytabs.appendChild(b);
  });
  pg.appendChild(ytabs);

  // 월 탭
  const mnav = document.createElement('div');
  mnav.className = 'plan-mnav';
  const yt = PLAN_YEAR_TABS.find(y=>y.id===planCurYear);
  yt.months.forEach(m => {
    const b = document.createElement('button');
    b.className = 'plan-mtab' + (m===planCurMonth?' active':'');
    b.textContent = MN_LABELS[m];
    b.onclick = () => { planCurMonth=m; renderPlan(pg); };
    mnav.appendChild(b);
  });
  pg.appendChild(mnav);

  // 월 데이터
  const mo = PLAN_MONTHS.find(x=>x.year===parseInt(planCurYear)&&x.month===planCurMonth);
  if (!mo) { const d=document.createElement('div'); d.textContent='데이터 없음'; pg.appendChild(d); return; }

  const mk = planCurYear+'-'+(String(planCurMonth).padStart(2,'0'));
  const checks = getPlanChecks(mk);
  const done = Object.values(checks).filter(Boolean).length;
  const pct = mo.days.length>0 ? Math.round(done/mo.days.length*100) : 0;
  const ps = PLAN_PSUMMARY[mk] || ['',''];

  // PSUMMARY에서 단원 정보 추출 (현행/선행 각각)
  // ps[0] = 현행 단원명, ps[1] = 선행 단원명
  const schUnit = ps[0] || '';
  const advUnit = ps[1] || '';

  // 월 개요
  const moCard = document.createElement('div');
  moCard.className = 'plan-mo';
  moCard.innerHTML = `<div class="plan-mo-title">${planCurYear}년 ${planCurMonth}월</div>
    <div class="plan-mo-tags"><span class="plan-tag sch">🏫 ${schUnit}</span><span class="plan-tag adv">📚 ${advUnit}</span></div>
    <div class="plan-pb-wrap">
      <div class="plan-pb"><div class="plan-pbf" style="width:${pct}%;background:${pct===100?'#1A7A47':'#3D35E8'};"></div></div>
      <div class="plan-pct">${done}/${mo.days.length} (${pct}%)</div>
    </div>`;
  pg.appendChild(moCard);

  // 주차별
  const WSIZE = 7;
  for (let wi=0; wi*WSIZE<mo.days.length; wi++) {
    const wdays = mo.days.slice(wi*WSIZE, (wi+1)*WSIZE);
    const ws = wdays[0].date, we = wdays[wdays.length-1].date;
    const wdone = wdays.filter((_,j)=>checks[wi*WSIZE+j]).length;
    const hasTodayW = wdays.some(d=>d.date===PLAN_TODAY);

    const blk = document.createElement('div');
    blk.className = 'plan-week';
    const todayBadge = hasTodayW?'<span style="background:var(--acc);color:#fff;font-size:8px;padding:1px 5px;border-radius:100px;margin-left:4px;">이번 주</span>':'';
    const whd = document.createElement('div');
    whd.className = 'plan-whd';
    whd.innerHTML = `<div style="display:flex;align-items:center;gap:7px;"><span class="plan-wt">${wi+1}주차${todayBadge}</span><span class="plan-wm">${ws.slice(5).replace('-','/')} ~ ${we.slice(5).replace('-','/')}</span></div>
      <div style="display:flex;align-items:center;gap:6px;"><span style="font-size:10px;color:var(--t3);">${wdone}/${wdays.length}일</span><span class="plan-wa ${wi===0||hasTodayW?'open':''}">▾</span></div>`;

    const wbody = document.createElement('div');
    wbody.style.display = (wi===0||hasTodayW)?'':'none';

    const tbl = document.createElement('table');
    tbl.className = 'plan-tbl';
    tbl.innerHTML = '<thead><tr><th style="width:32px;text-align:center;">완료</th><th style="width:52px;">날짜</th><th>구분</th><th>학습 내용</th><th>교재</th><th style="width:44px;">시간</th></tr></thead>';
    const tbody = document.createElement('tbody');

    wdays.forEach((day, j) => {
      const gi = wi*WSIZE+j;
      const isToday = day.date===PLAN_TODAY;
      const isDone = !!checks[gi];
      const isAdv = day.type==='advance';
      // ★ 단원 정보 괄호 추가
      const unitTag = isAdv
        ? (advUnit ? `<span style="font-size:10px;color:#3C3489;opacity:.75;">(${advUnit})</span>` : '')
        : (schUnit ? `<span style="font-size:10px;color:var(--green);opacity:.75;">(${schUnit})</span>` : '');
      const tr = document.createElement('tr');
      if(isToday) tr.className='today-plan-row';
      tr.innerHTML = `
        <td style="text-align:center;">
          <div onclick="togglePlanCheck('${mk}',${gi})" style="cursor:pointer;width:16px;height:16px;border-radius:4px;border:1.5px solid ${isDone?(isAdv?'var(--acc)':'var(--green)'):'var(--bd2)'};display:flex;align-items:center;justify-content:center;margin:0 auto;background:${isDone?(isAdv?'var(--acc)':'var(--green)'):'transparent'};">
            ${isDone?'<span style="color:#fff;font-size:10px;font-weight:700;">✓</span>':''}
          </div>
        </td>
        <td>
          <div class="plan-dn ${isToday?'td':''}">${day.date.slice(5).replace('-','/')}</div>
          <div class="plan-dk ${isToday?'td':''}">${day.dayKr}${isToday?'<span class="today-badge">오늘</span>':''}</div>
        </td>
        <td><span class="type-pill ${day.type}">${isAdv?'선행':'현행'}</span></td>
        <td>
          <div class="plan-dc" style="${isDone?'text-decoration:line-through;color:var(--t3);':''}">${day.content}</div>
          <div style="margin-top:2px;">${unitTag}</div>
        </td>
        <td><div class="plan-db">${day.book}</div></td>
        <td><span class="plan-dm">${day.minutes}분</span></td>`;
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    wbody.appendChild(tbl);

    whd.onclick = () => {
      const open = wbody.style.display!=='none';
      wbody.style.display = open?'none':'';
      whd.querySelector('.plan-wa').classList.toggle('open', !open);
    };

    blk.appendChild(whd); blk.appendChild(wbody);
    pg.appendChild(blk);
  }

  // 오늘로 스크롤
  setTimeout(() => {
    const r = pg.querySelector('.today-plan-row');
    if (r) r.scrollIntoView({behavior:'smooth', block:'center'});
  }, 100);
}

function togglePlanCheck(mk, idx) {
  const checks = getPlanChecks(mk);
  const wasDone = !!checks[idx];
  setPlanCheck(mk, idx, !wasDone);
  const mo = PLAN_MONTHS.find(x=>{
    const key = x.year+'-'+(String(x.month).padStart(2,'0'));
    return key===mk;
  });
  const isAdv = mo && mo.days[idx] && mo.days[idx].type==='advance';
  if(!wasDone) showToast(isAdv?'📚 선행 완료! 잘했어 👏':'🏫 현행 완료! 수고했어 👏');
  // 체크박스만 업데이트 (전체 re-render 하지 않음)
  const allCbs = document.querySelectorAll('[onclick^="togglePlanCheck(\''+mk+'\','+idx+')"]');
  allCbs.forEach(cb => {
    const nowDone = !wasDone;
    cb.style.background = nowDone?(isAdv?'var(--acc)':'var(--green)'):'transparent';
    cb.style.borderColor = nowDone?(isAdv?'var(--acc)':'var(--green)'):'var(--bd2)';
    cb.innerHTML = nowDone?'<span style="color:#fff;font-size:9px;font-weight:700;">✓</span>':'';
  });
  // 진도율 업데이트
  const pg = document.getElementById('mainPage');
  const pctEl = pg.querySelector('.plan-pct');
  if(pctEl && mo) {
    const c2 = getPlanChecks(mk);
    const done2 = Object.values(c2).filter(Boolean).length;
    const pct2 = Math.round(done2/mo.days.length*100);
    pctEl.textContent = done2+'/'+mo.days.length+' ('+pct2+'%)';
    const pbf = pg.querySelector('.plan-pbf');
    if(pbf) pbf.style.width = pct2+'%';
  }
}

// ══════════════════════════════════════════
// 9. 수학 계통도
// ══════════════════════════════════════════
function renderMap(pg) {
  pg.style.padding = '20px';
  pg.innerHTML = '';

  const mapAreas = MAP_AREAS;
  let activeArea = mapActiveArea;

  // 상단
  pg.innerHTML = `<div style="font-size:17px;font-weight:700;margin-bottom:12px;">🗺 수학 계통도</div>`;

  // 뷰 버튼
  const vbtns = document.createElement('div');
  vbtns.className = 'map-vbtns';
  ['all','elem','mid','high'].forEach(v => {
    const lb = {all:'전체',elem:'초등',mid:'중학교',high:'고등학교'}[v];
    const b = document.createElement('button');
    b.className = 'map-vbtn'+(mapView===v?' active':'');
    b.textContent = lb;
    b.onclick = () => { mapView=v; renderMap(pg); };
    vbtns.appendChild(b);
  });
  pg.appendChild(vbtns);

  // 범례
  const leg = document.createElement('div');
  leg.className = 'map-leg';
  mapAreas.forEach(a => {
    const item = document.createElement('div');
    item.className = 'map-leg-i' + (activeArea&&activeArea!==a.id?' dimmed':'');
    item.style.opacity = (activeArea&&activeArea!==a.id) ? '0.3' : '1';
    item.innerHTML = `<div class="map-leg-d" style="background:${a.bd};"></div>${a.name}`;
    item.onclick = () => { mapActiveArea = mapActiveArea===a.id?null:a.id; renderMap(pg); };
    leg.appendChild(item);
  });
  pg.appendChild(leg);

  // SVG 영역
  const mapWrap = document.createElement('div');
  mapWrap.className = 'map-wrap';
  mapWrap.style.cssText = 'min-height:300px;';
  const svg = buildMapSvg(mapAreas, activeArea);
  mapWrap.innerHTML = svg;
  mapWrap.innerHTML += '<div class="map-tt" id="mapTt"></div>';
  pg.appendChild(mapWrap);

  // 상세 패널
  const detail = document.createElement('div');
  detail.className = 'map-detail';
  detail.id = 'mapDetail';
  detail.innerHTML = '<span style="color:var(--t3);">단원을 클릭하면 연결 정보를 볼 수 있어요</span>';
  pg.appendChild(detail);

  // 이벤트
  mapWrap.addEventListener('mousemove', e => {
    const tt = document.getElementById('mapTt');
    if (tt && tt.classList.contains('show')) {
      const r = mapWrap.getBoundingClientRect();
      let lx = e.clientX-r.left+12, ly = e.clientY-r.top+mapWrap.scrollTop-10;
      if(lx+210>mapWrap.clientWidth) lx=e.clientX-r.left-215;
      tt.style.left=lx+'px'; tt.style.top=ly+'px';
    }
  });
}

function getMapCols(view) {
  const ALL = ['초1','초2','초3','초4','초5','초6','중1','중2','중3','고1','고2'];
  const ELEM = ['초1','초2','초3','초4','초5','초6'];
  const MID = ['중1','중2','중3'];
  const HIGH = ['고1','고2'];
  if(view==='elem') return ELEM;
  if(view==='mid') return MID;
  if(view==='high') return HIGH;
  return ALL;
}

function buildMapSvg(mapAreas, activeArea) {
  const cols = getMapCols(mapView);
  const colIds = new Set(cols);
  const CW=120, CH=10, RH=44, RG=4, AG=16, TPH=72, LP=10;
  const colX = {}; cols.forEach((c,i)=>colX[c]=LP+i*(CW+CH));

  const visNodes = MAP_NODES.filter(n=>colIds.has(n.grade));
  const areaIds = mapAreas.map(a=>a.id);
  const slots = {}; areaIds.forEach(a=>{slots[a]={};cols.forEach(c=>slots[a][c]=[]); });
  visNodes.forEach(n=>slots[n.area][n.grade].push(n.id));
  const nodeY={}, aStartY={}, aEndY={};
  let cy=0;
  areaIds.forEach(aid=>{
    aStartY[aid]=cy;
    let ms=0; cols.forEach(c=>ms=Math.max(ms,slots[aid][c].length));
    cols.forEach(c=>slots[aid][c].forEach((nid,ri)=>nodeY[nid]=cy+ri*(RH+RG)));
    cy+=Math.max(1,ms)*(RH+RG)-RG+AG; aEndY[aid]=cy-AG;
  });

  const svgW=LP+cols.length*(CW+CH);
  const svgH=cy+TPH+20;

  // SECS
  const SECS = [
    {label:'초등학교',cols:['초1','초2','초3','초4','초5','초6'],bg:'#FFF8E1',bd:'#F57C00',tc:'#E65100'},
    {label:'중학교',cols:['중1','중2','중3'],bg:'#FCE4EC',bd:'#C2185B',tc:'#880E4F'},
    {label:'고등학교',cols:['고1','고2'],bg:'#E8F5E9',bd:'#2E7D32',tc:'#1B5E20'},
  ];

  let s = `<svg id="mapSvg" viewBox="0 0 ${svgW} ${svgH}" width="${svgW}" height="${svgH}" style="display:block;min-width:${svgW}px;">`;
  s += '<defs>';
  mapAreas.forEach(a=>{
    s += `<marker id="ar_${a.id}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1L7 4L1 7" fill="none" stroke="${a.bd}88" stroke-width="1.5" stroke-linecap="round"/></marker>`;
  });
  s += '</defs>';

  SECS.forEach(sec=>{
    const vc=sec.cols.filter(c=>colIds.has(c)); if(!vc.length) return;
    const x1=colX[vc[0]], x2=colX[vc[vc.length-1]]+CW;
    s += `<rect x="${x1-2}" y="2" width="${x2-x1+4}" height="36" rx="5" fill="${sec.bg}" stroke="${sec.bd}" stroke-width="0.8"/>
      <text x="${(x1+x2)/2}" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="${sec.tc}">${sec.label}</text>`;
  });

  cols.forEach(c=>{
    s += `<text x="${colX[c]+CW/2}" y="${TPH-8}" text-anchor="middle" font-size="10" font-weight="600" fill="#555">${c}</text>`;
  });

  mapAreas.forEach(a=>{
    const y1=TPH+aStartY[a.id]-4, y2=TPH+aEndY[a.id]+4;
    const op = (activeArea&&activeArea!==a.id)?'0.07':'0.38';
    s += `<rect x="${LP-2}" y="${y1}" width="${svgW-LP+2}" height="${y2-y1}" rx="5" fill="${a.bg}" opacity="${op}"/>
      <text x="${LP+1}" y="${y1+11}" font-size="9" font-weight="700" fill="${a.hd}" opacity="${(activeArea&&activeArea!==a.id)?'0.15':'1'}">${a.name}</text>`;
  });

  // connections
  visNodes.forEach(n=>{
    const area=mapAreas.find(a=>a.id===n.area);
    const op = (activeArea&&activeArea!==n.area)?'0.03':'0.45';
    n.deps.filter(d=>colIds.has((MAP_NODES.find(x=>x.id===d)||{}).grade)).forEach(depId=>{
      const dep=MAP_NODES.find(x=>x.id===depId); if(!dep) return;
      const x1=colX[dep.grade]+CW, y1=TPH+nodeY[depId]+RH/2;
      const x2=colX[n.grade], y2=TPH+nodeY[n.id]+RH/2;
      const mx=(x1+x2)/2;
      s += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${area.bd}55" stroke-width="1.2" opacity="${op}" marker-end="url(#ar_${area.id})"/>`;
    });
  });

  // nodes
  visNodes.forEach(n=>{
    const area=mapAreas.find(a=>a.id===n.area);
    const op = (activeArea&&activeArea!==n.area)?'0.08':'1';
    const x=colX[n.grade], y=TPH+nodeY[n.id];
    const lines=n.name.split('\n');
    const deps=n.deps.map(d=>MAP_NODES.find(x=>x.id===d)).filter(Boolean);
    const nexts=MAP_NODES.filter(x=>x.deps.includes(n.id));
    const tipData=JSON.stringify({unit:n.unit,grade:n.grade,sem:n.sem,name:n.name.replace(/\n/g,' · '),deps:deps.map(d=>d.unit+' '+d.name.replace(/\n/g,' ')).join(', '),nexts:nexts.map(nx=>nx.unit+' '+nx.name.replace(/\n/g,' ')).join(', ')}).replace(/"/g,'&quot;');
    s += `<g opacity="${op}" style="cursor:pointer" onclick="selectMapNode(${JSON.stringify(n.id).replace(/"/g,'&quot;')})" onmouseenter="showMapTip(event,${tipData})" onmouseleave="hideMapTip()">
      <rect x="${x}" y="${y}" width="${CW}" height="${RH}" rx="5" fill="${area.bg}" stroke="${area.bd}" stroke-width="1"/>
      <text x="${x+4}" y="${y+10}" font-size="7" fill="${area.bd}" font-family="monospace" opacity="0.85">${n.unit}</text>
      <text x="${x+CW-3}" y="${y+10}" text-anchor="end" font-size="7" fill="${area.bd}" opacity="0.7">${n.sem}학기</text>`;
    if(lines.length===1){
      s += `<text x="${x+CW/2}" y="${y+RH/2+5}" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="${area.tx}">${lines[0].length>13?lines[0].slice(0,12)+'…':lines[0]}</text>`;
    } else {
      lines.slice(0,2).forEach((ln,li)=>{
        s += `<text x="${x+CW/2}" y="${y+(li===0?RH/2-2:RH/2+9)}" text-anchor="middle" font-size="9" font-weight="600" fill="${area.tx}">${ln.length>15?ln.slice(0,14)+'…':ln}</text>`;
      });
    }
    s += '</g>';
  });

  s += '</svg>';
  return s;
}

function selectMapNode(nid) {
  const n = MAP_NODES.find(x=>x.id===nid); if(!n) return;
  const area = MAP_AREAS.find(a=>a.id===n.area);
  const deps = n.deps.map(d=>MAP_NODES.find(x=>x.id===d)).filter(Boolean);
  const nexts = MAP_NODES.filter(x=>x.deps.includes(nid));
  const detail = document.getElementById('mapDetail'); if(!detail) return;
  let html = `<div style="font-size:10px;font-family:monospace;color:${area.bd};margin-bottom:3px;">${n.unit} · ${n.grade} ${n.sem}학기</div>
    <div style="font-size:14px;font-weight:700;color:${area.bd};margin-bottom:5px;">${n.name.replace(/\n/g,' · ')}</div>`;
  if(deps.length){
    html += '<div style="font-size:10px;color:var(--t3);margin-bottom:3px;">⬆ 선수 단원</div><div class="d-tags">';
    deps.forEach(d=>{const da=MAP_AREAS.find(a=>a.id===d.area);html+=`<span class="dtag" style="background:${da.bg};color:${da.tx};">${d.unit} ${d.name.replace(/\n/g,' ')}</span>`;});
    html += '</div>';
  }
  if(nexts.length){
    html += '<div style="font-size:10px;color:var(--t3);margin-top:6px;margin-bottom:3px;">⬇ 이후 연결 단원</div><div class="d-tags">';
    nexts.forEach(nx=>{const na=MAP_AREAS.find(a=>a.id===nx.area);html+=`<span class="dtag" style="background:${na.bg};color:${na.tx};">${nx.unit} ${nx.name.replace(/\n/g,' ')}</span>`;});
    html += '</div>';
  }
  detail.innerHTML = html;
}

function showMapTip(e, data) {
  const tt = document.getElementById('mapTt'); if(!tt) return;
  tt.innerHTML = `<div style="font-size:9px;font-family:monospace;color:#666;margin-bottom:2px;">${data.unit} · ${data.grade} ${data.sem}학기</div>
    <div style="font-size:12px;font-weight:700;">${data.name}</div>
    ${data.deps?'<div style="font-size:9px;color:#aaa;margin-top:3px;">선수: '+data.deps+'</div>':''}`;
  tt.classList.add('show');
  const wrap = tt.parentElement;
  const r = wrap.getBoundingClientRect();
  let lx=e.clientX-r.left+12, ly=e.clientY-r.top+wrap.scrollTop-10;
  if(lx+210>wrap.clientWidth) lx=e.clientX-r.left-215;
  tt.style.left=lx+'px'; tt.style.top=ly+'px';
}
function hideMapTip(){ const tt=document.getElementById('mapTt'); if(tt) tt.classList.remove('show'); }

// 10. 자녀 관리 모달
// ══════════════════════════════════════════
function openManage() {
  const list = document.getElementById('manageList');
  list.innerHTML = '';
  state.children.forEach((c,i) => {
    const row = document.createElement('div');
    row.className = 'child-row';
    row.style.marginBottom = '8px';
    row.innerHTML = `<input class="finput cn" value="${c.name}" placeholder="이름" style="flex:1;">
      <select class="finput cg" style="width:88px;">${[1,2,3,4,5,6].map(g=>`<option value="${g}"${c.grade===g?' selected':''}>${g}학년</option>`).join('')}</select>
      <button class="del-btn" onclick="this.parentElement.remove()">×</button>`;
    list.appendChild(row);
  });
  document.getElementById('manageModal').classList.add('open');
}
function addChildRow() {
  const list = document.getElementById('manageList');
  const row = document.createElement('div');
  row.className = 'child-row';
  row.style.marginBottom = '8px';
  row.innerHTML = `<input class="finput cn" placeholder="이름" style="flex:1;">
    <select class="finput cg" style="width:88px;">${[1,2,3,4,5,6].map(g=>`<option value="${g}">${g}학년</option>`).join('')}</select>
    <button class="del-btn" onclick="this.parentElement.remove()">×</button>`;
  list.appendChild(row);
}
function saveManage() {
  const rows = document.querySelectorAll('#manageList .child-row');
  const children = [];
  rows.forEach(r => {
    const nm = r.querySelector('.cn').value.trim();
    const gr = parseInt(r.querySelector('.cg').value);
    if(nm) children.push({name:nm, grade:gr});
  });
  if(!children.length){ showToast('자녀를 최소 1명 추가해주세요'); return; }
  state.children = children;
  state.familyCode = _fcode || 'LOCAL';
  lsSet('sunwoo_state', state);
  if (_db && _fcode) { _db.ref('families/' + _fcode + '/state').set(state); }
  curChild = children[0].name; curGrade = children[0].grade;
  curView = 'child';
  document.getElementById('manageModal').classList.remove('open');
  renderSidebar(); renderPage();
  showToast('저장됐어요!');
}
function closeModal(e){ if(e.target===document.getElementById('manageModal')) document.getElementById('manageModal').classList.remove('open'); }

// 11. 토스트
// ══════════════════════════════════════════
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
